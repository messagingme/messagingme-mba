name: CI front (console Next)

# 🔴 LE JOB DU FRONT VIT DANS SON PROPRE FICHIER POUR NE TOURNER QUE QUAND LE FRONT BOUGE (2026-09-15).
# Mesure sur les 300 runs du 2 au 15 septembre : 141 d'entre eux (47 %) ne touchaient QUE le backend, et ce
# job y a tourne 8,8 minutes en moyenne, soit 1 241 minutes passees a re-verifier un front identique au
# precedent. Il etait aussi le POTEAU LE PLUS LONG : un correctif de backend attendait douze minutes son
# verdict au lieu de quatre.
#
# 🔴 CE N'EST PAS UN GARDE-FOU AFFAIBLI, ET C'EST VERIFIABLE. Ce job ne PEUT PAS voir un changement de
# backend : aucun fichier de `web/` n'importe quoi que ce soit de `src/` (verifie), et les E2E INTERCEPTENT
# tous les appels `/api/backend/**` par `page.route` (aucun spec ne nomme un vrai backend, verifie). Sur un
# push qui ne touche pas `web/`, ses entrees sont identiques au run precedent : c'est le meme controle sur
# les memes octets.
#
# ⚠️ L'INVERSE EST FAUX, ET C'EST LE PIEGE A NE PAS REPRODUIRE : 43 tests de la RACINE lisent des fichiers de
# `web/` (les tests de parite, qui comparent une liste du serveur a sa jumelle du navigateur). Le job `unit`
# doit donc continuer de tourner sur un changement purement front, et c'est pour ca que `ci.yml` garde son
# `paths-ignore: '**.md'` plutot qu'un filtre positif sur le backend.
#
# ⚠️ Tient parce qu'on n'a pas de branch protection avec check requis (solo sur main, pas de PR) : sinon un
# run sauté laisserait le check « en attente », comme pour `paths-ignore`.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/**.md'
      # La doc en Markdown générée depuis les pages (lot 17) : un `.md` de `public/` changé seul doit passer
      # `lib/doc-md.test.ts`, sinon c'est le push front suivant qui devient rouge pour une raison étrangère.
      - 'web/public/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '!web/**.md'
      # La doc en Markdown générée depuis les pages (lot 17) : un `.md` de `public/` changé seul doit passer
      # `lib/doc-md.test.ts`, sinon c'est le push front suivant qui devient rouge pour une raison étrangère.
      - 'web/public/**'
      - '.github/workflows/ci-web.yml'

# Groupe DISTINCT de celui de `ci.yml` : un groupe partage ferait s'annuler les deux moities de la CI.
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # 🔴 LA SEULE TOPOLOGIE LIVREE : `vercel`, celle de `console.messagingme.app`, construite avec une adresse
    # d'API absolue sur une AUTRE origine (`playwright.config.ts`) ; la garde de la CSP (`e2e/aide/test.ts`) fait
    # echouer un spec qui la viole. La jambe `proxy` (la console du VPS, `mba.`, qui appelait `/api/backend` sur sa
    # propre origine) est retiree le 2026-11-21 : `mba.messagingme.app` est supprime depuis le 2026-10-26, cette
    # console n'est plus servie nulle part, et la jambe coutait 1 230 minutes par semaine. Le relais reste celui de
    # `npm run dev` en local, qui le montre a qui developpe ; `E2E_TOPOLOGIE=proxy` le rejoue a la main.
    #
    # 🔴 LES E2E SONT COUPES EN DEUX MOITIES, SUR DEUX MACHINES EN PARALLELE (2026-11-21). Ils prenaient 12 min 30
    # sur une seule (2 045 tests, deja quatre processus, le maximum utile d'une machine), soit l'essentiel des
    # 15 a 17 minutes d'attente. `--shard=N/2` de Playwright repartit les FICHIERS de tests en deux parts fixes :
    # chaque test tourne une fois, sur une seule machine. Le job est rouge si l'une des deux moities l'est.
    # ⚠️ LE PIEGE EST UNE REPARTITION FAUSSE (deux fois `1/2`) : la moitie des tests ne tournerait jamais, en vert.
    # `tests/ci-decoupage.test.ts` exige exactement `[1, 2]` et `--shard=${{ matrix.moitie }}/2`.
    # Ce qui ne depend pas des e2e ne tourne que sur UNE machine, la moitie 2 : les controles (build, lint, tsc,
    # vitest), le build de production et sa verification. Mesure du premier run (2026-11-21) : la moitie 1 tire la
    # part d'e2e la plus lourde (7,6 min contre 5,9) ; avec les controles en plus, elle finissait a 11,4 min contre
    # 8,1. Tout sur la 2 les ramene l'une vers l'autre. Si l'equilibre bouge (des specs ajoutes), on remesure ici.
    name: web (${{ matrix.moitie }}/2)
    strategy:
      fail-fast: false
      matrix:
        moitie: [1, 2]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Même version que l'image de production (node:22-alpine, web/Dockerfile).
          node-version: 22
          cache: npm
          # Sans ce chemin, la clé de cache serait calculée sur le lockfile RACINE et raterait
          # l'invalidation quand les deps de web/ changent.
          cache-dependency-path: web/package-lock.json
      # 🔴 LE CACHE DE COMPILATION DE NEXT, D'UN RUN A L'AUTRE (2026-11-21), celui que la documentation de Next
      # recommande en CI. Il ne garde pas la console construite, il garde des morceaux de compilation etiquetes par
      # le CONTENU de leur fichier source : un fichier change est recompile, les autres sont repris. Le resultat est
      # donc reassemble a chaque run depuis le code du push.
      # ⚠️ Ce qu'une empreinte de fichier ne voit pas (une montee de Next ou d'une dependance, la configuration de
      # Next, de TypeScript, de PostCSS ou de Tailwind) est dans le PREFIXE de la cle, que `restore-keys` reprend en
      # entier : si l'un d'eux change, aucun ancien cache n'est restaure, le build repart de zero.
      # ⚠️ AVANT `npm ci` : apres, `web/**` compterait `node_modules` dans l'empreinte des sources.
      # ⚠️ RESTAURE ICI, ENREGISTRE EN FIN DE JOB MEME SUR UN ECHEC : `actions/cache` d'un seul tenant n'enregistre
      # que si le job reussit, et un e2e rouge (sans rapport avec la compilation) laisserait le cache vide.
      - uses: actions/cache/restore@v4
        id: cache-next
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/next.config.*', 'web/tsconfig.json', 'web/postcss.config.*', 'web/tailwind.config.*') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.js', 'web/**/*.jsx', 'web/**/*.mjs', 'web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/next.config.*', 'web/tsconfig.json', 'web/postcss.config.*', 'web/tailwind.config.*') }}-
      - run: npm ci
      # Build AVANT tsc : next build régénère next-env.d.ts (gitignore) et .next/types, sans lesquels
      # tsc plante sur des types fantômes. Le build fait déjà le type-check ET la passe ESLint de Next
      # (qui n'échoue que sur des erreurs, pas des warnings). Aucun BACKEND_URL requis (fallback next.config.mjs).
      - name: Build Next (type-check + lint inclus)
        if: matrix.moitie == 2
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Lint (next/core-web-vitals)
        if: matrix.moitie == 2
        run: npm run lint
      - name: Type-check exhaustif
        if: matrix.moitie == 2
        run: npx tsc --noEmit
      - name: Tests unitaires front (vitest)
        if: matrix.moitie == 2
        run: npm test
      # E2E : les appels /api/backend/* sont mockés par page.route -> aucun backend ni base requis. Le webServer
      # de Playwright build + sert le Next ; on installe juste le navigateur (avec ses deps système).
      - name: Installer le navigateur E2E
        # Le miroir apt de GitHub tombe parfois (le 2026-11-11, plus d'une heure) : `--with-deps` échoue alors en 100,
        # avant le navigateur, et chaque CI front est rouge pour une raison étrangère. Les machines de GitHub portent
        # déjà les bibliothèques de Chrome : on installe alors Chromium sans elles. S'il en manque une, les E2E le disent.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Tests E2E (Playwright)
        run: npm run test:e2e -- --shard=${{ matrix.moitie }}/2
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          E2E_TOPOLOGIE: vercel
      # 🔴 LA VALEUR REELLEMENT LIVREE. Les E2E de la topologie `vercel` exercent une adresse d'API absolue, mais
      # factice (`127.0.0.1`). Ce build-ci pose celle de la production, et le script verifie qu'elle est scellee
      # dans le bundle ET que la CSP servie autorise son origine.
      #
      # ⚠️ EN DERNIER, et ce n'est pas cosmetique : `npm run build` ecrase `.next`, et le serveur de
      # Playwright reutilise ce repertoire. Construire avec la vraie adresse AVANT les E2E ferait appeler `api.`
      # par la console, donc plus aucune interception, donc toutes les specs rouges.
      - name: Build avec l adresse d API de production
        if: matrix.moitie == 2
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://api.messagingme.app
      # Un build qui passe ne prouve QUE la compilation. La variable est figee AU BUILD : la changer sans
      # reconstruire ne fait rien, en silence. On verifie donc qu'elle est bien SCELLEE dans le bundle client.
      - name: La base d API est scellee dans le bundle, et la CSP l autorise
        if: matrix.moitie == 2
        run: node scripts/verifier-base-api.mjs https://api.messagingme.app
      - uses: actions/cache/save@v4
        if: always() && steps.cache-next.outputs.cache-hit != 'true' && hashFiles('web/.next/cache/**') != ''
        with:
          path: web/.next/cache
          key: ${{ steps.cache-next.outputs.cache-primary-key }}
